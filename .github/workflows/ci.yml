name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck libxml2-utils php-cli qemu-utils libvirt-clients

      - name: Run tests
        env:
          CI: "true"
        run: tests/run.sh
